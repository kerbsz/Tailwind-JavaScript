<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/src/output.css">
        <title>PROJECT_1</title>
    </head>
    <body>
        <div class="flex bg-green-400 justify-center items-center p-5 m-5 ">
            <div>
                    <label id="valuelbl" for="" class="block text-center text-7xl m-3.5">0</label>
                    <button onclick="decreaseME()" id="decrease" class="bg-gray-400 hover:bg-white rounded-2xl p-2 boder border-2 border-black text-2xl cursor-pointer">DECREASE</button>
                    <button  onclick="resetME()" id="reset" class="bg-gray-400 hover:bg-white rounded-2xl p-2 boder border-2 border-black text-2xl cursor-pointer">RESET</button>
                    <button onclick="increaseME()" id="increase" class="bg-gray-400 hover:bg-white rounded-2xl p-2 boder border-2 border-black text-2xl cursor-pointer">INCREASE</button>
            </div>
        </div>
        <div class="grid grid-rows-1 grid-cols-1 gap-2 mt-2 mx-2 text-center"> 
            <div class="bg-green-400 md:bg-yellow-500 p-2.5" >
                <p id="lblrandomNum">lorem ipsum</p>
                <button onclick="randomNum()" id="btnRandom" class="hover:bg-amber-200 cursor-pointer bg-amber-400 border-2 rounded-2xl p-2 font-mono">RANDOM NUMBER</button>
                
            </div>
        </div>

        <div class="bg-yellow-300 grid grid-rows-1 grid-cols-1 gap-2 mt-2 mx-2 p-2 text-center"> 
            <div class="bg-blue-400 md:bg-blue-500 p-2.5" >
                <input type="checkbox" id="subscribe" class="accent-green-600">
                <label for="subscribe">Subscribe</label>       
            </div>
            <div class="bg-red-400 md:bg-orange-500 p-2.5 text-white" >
                <input class="accent-red-700 p-2" id="gcash" value="Gcash" type="radio" name="payment">
                <label class="p-2" for="gcash" >Gcash</label>

                <input class="accent-red-700 p-2" id="paypal" type="radio" value="Paypal" name="payment">
                <label class="p-2" for="paypal">Paypal</label>

                <input class="accent-red-700 p-2" id="visa" type="radio" value="Visa" name="payment">
                <label class="p-2" for="visa">Visa</label>
                <br>
                <button onclick="sumbit()" id="submit" class="border-2 bg-red-400 hover:bg-red-700 p-1 rounded-xl cursor-pointer">SUBMIT</button>
            </div>

        </div>

    </body>
    <script src="script.js"></script>
</html>
