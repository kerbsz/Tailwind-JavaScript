<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/src/output.css">
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
        <title>POKEMON FINDS</title>
    </head>
    <body>
        <div class="h-screen w-full flex items-center justify-center">
            <div class="w-[80%] bg-white/40 rounded-2xl p-3 backdrop-blur-xs shadow-black shadow-2xl lg:[30%] md:max-w-md  ">
                <h1 class="text-black text-center text-5xl font-serif max-sm:text-4xl">POKEMON FINDS</h1>
                <div class="grid grid-cols-2 gap-1.5">
                    <input id="pokemonName" type="text" placeholder="Enter pokemon name / id: " class="hover:bg-white/50 transition delay-100 ease-in-out duration-200 border text-center border-white/60  focus:bg-black focus:text-white p-2 rounded-3xl">
                    <button onclick="fetchData()" id="submit" class=" border rounded-2xl cursor-pointer hover:bg-black/90 hover:text-white transition delay-100 ease-in-out duration-150">Submit</button>
                    <br>
                </div>
                <div class="bg-black/50 rounded-2xl w-[90%] mx-auto p-3 text-center text-white grid mb-3">
                    <div class="border rounded-2xl p-2">
                        <img id="pokemonSprite" src="img/bg.jpg" alt="pokemon" class="h-auto rounded-2xl m-auto border-2 border-white hover:scale-102 transition-transform duration-200 delay-100 ease-in-out">
                    </div>
                    <hr class="border">
                    <p id="name">Name: </p>
                    <p id="id">ID: </p>
                    <p id="weight">Weight: </p>
                    <p id="battleExp">Battle Experience: </p>
                </div>
            </div>
            
        </div>
        
    </body>
    <script src="script.js"></script>
</html>
