<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="/src/output.css">
        <title>Real PROJECT 2</title>
    </head>
    <body>
        <div class="p-5 flex justify-center items-center flex-col gap-5 h-screen m-0 backdrop-blur-xs">
            <div class="bg-black/20 backdrop-blur-[5px] shadow-2xl shadow- w-full p-10 rounded-2xl text-center text-white">
                <h1 class="text-black font-mono text-xl">DIGITAL CLOCK</h1>
                <h1 id="clock" class="font-mono text-5xl" >00:00:00</h1>
            </div>
            <div class="bg-black/20 backdrop-blur-[5px] shadow-2xl shadow- w-full p-10 rounded-2xl text-center text-white">
                <h1 class="text-black font-mono text-xl">STOP WATCH</h1>
                <h1 id="stopwatchClock" class="font-mono text-5xl" >00:00:00</h1>
                <div>
                    <button onclick="start()" class="border-2 p-3 rounded-2xl hover:bg-green-600 duration-500 hover:text-black ease-in">Start</button>
                    <button onclick="stop()" class="border-2 p-3 rounded-2xl hover:bg-red-600 hover:text-black ease-in">Stop</button>
                    <button onclick="restart()" class="border-2 p-3 rounded-2xl hover:bg-green-600 hover:text-black ease-in">Restart</button>
                </div>

            </div>
        </div>

        
    </body>
    <script src="script.js"></script>
</html>
